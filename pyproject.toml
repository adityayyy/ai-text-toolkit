[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-text-toolkit"
version = "0.1.0"
description = "Local AI text detector + humanizer"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Aditya", email = "aditya@example.com"}
]
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "transformers>=4.35.0",
    "numpy>=1.24.0",
    "huggingface-hub>=0.23.0,<3.0",
    "nltk>=3.8.0",
    "scikit-learn>=1.3.0",
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.1.0",
    "datasets>=2.15.0",
    "httpx>=0.25.0",
    "llama-cpp-python>=0.3.0",
    "joblib>=1.3.0",
    "typing-extensions>=4.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "black>=23.0.0",
    "mypy>=1.5.0",
    "pre-commit>=3.5.0",
]

[project.urls]
Homepage = "https://github.com/yourusername/ai-text-toolkit"
Repository = "https://github.com/yourusername/ai-text-toolkit"

[tool.setuptools.packages.find]
where = ["."]
include = ["config*", "core*", "api*", "web*", "scripts*", "tests*"]

[tool.ruff]
line-length = 100
target-version = "py310"
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # function calls in default argument
]

[tool.black]
line-length = 100
target-version = ["py310"]
include = '\\.pyi?$'
extend-exclude = '''
/(
  \.git
  | \.venv
  | build
  | dist
)/
'''

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_optional = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.pytest-cov]
cov_report = ["term-missing", "xml"]